<svg xmlns="http://www.w3.org/2000/svg" width="886" height="1920" viewBox="0 0 886 1920" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Placeholder poster for the hero app-preview clip. An illustration, not a screenshot. Source for media/kankan-preview-poster.png. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0b2a28" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f1"/>
      <stop offset="1" stop-color="#efefe9"/>
    </linearGradient>
  </defs>
  <rect width="886" height="1920" fill="url(#bg)"/>

  <!-- status bar -->
  <text x="96" y="96" font-size="34" font-weight="600" fill="#15201f">9:41</text>
  <g fill="#15201f">
    <rect x="652" y="74" width="7" height="14" rx="2"/><rect x="664" y="69" width="7" height="19" rx="2"/><rect x="676" y="64" width="7" height="24" rx="2"/><rect x="688" y="59" width="7" height="29" rx="2"/>
    <rect x="718" y="60" width="56" height="28" rx="8" fill="none" stroke="#15201f" stroke-width="2.5" opacity=".45"/>
    <rect x="723" y="65" width="42" height="18" rx="4"/>
    <rect x="777" y="69" width="4" height="10" rx="2" opacity=".45"/>
  </g>

  <!-- navigation -->
  <g fill="#0b5e5a" font-size="34">
    <path d="M60 196 l-16 -18 l16 -18" fill="none" stroke="#0b5e5a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="190">My Board</text>
  </g>
  <circle cx="790" cy="178" r="34" fill="#0b5e5a" opacity=".1"/>
  <g fill="#0b5e5a"><circle cx="776" cy="178" r="4.5"/><circle cx="790" cy="178" r="4.5"/><circle cx="804" cy="178" r="4.5"/></g>

  <text x="56" y="306" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#15201f">Plan the garden</text>
  <text x="58" y="366" font-size="30" fill="#5a6463">My Board  ›  Plan the garden</text>

  <!-- progress -->
  <rect x="56" y="404" width="774" height="14" rx="7" fill="#0b5e5a" opacity=".12"/>
  <rect x="56" y="404" width="387" height="14" rx="7" fill="#0b5e5a"/>
  <text x="56" y="466" font-size="28" font-weight="600" fill="#0b5e5a">2 of 4 done</text>

  <!-- To Do -->
  <g transform="translate(56 540)">
    <circle cx="10" cy="-10" r="9" fill="#9aa7a5"/>
    <text x="32" y="0" font-size="30" font-weight="700" fill="#15201f">To Do</text>
    <text x="774" y="0" font-size="28" fill="#5a6463" text-anchor="end">1</text>
    <g transform="translate(0 32)" filter="url(#s)">
      <rect width="774" height="168" rx="30" fill="#ffffff"/>
      <text x="36" y="66" font-size="36" font-weight="600" fill="#15201f">Plant tomatoes</text>
      <rect x="36" y="96" width="112" height="44" rx="22" fill="#0b5e5a" opacity=".1"/>
      <text x="92" y="127" font-size="24" font-weight="600" fill="#0b5e5a" text-anchor="middle">home</text>
      <rect x="164" y="96" width="132" height="44" rx="22" fill="#ffb03a" opacity=".22"/>
      <text x="230" y="127" font-size="24" font-weight="600" fill="#8a5300" text-anchor="middle">Sat 10</text>
    </g>
  </g>

  <!-- Doing -->
  <g transform="translate(56 806)">
    <circle cx="10" cy="-10" r="9" fill="#ffb03a"/>
    <text x="32" y="0" font-size="30" font-weight="700" fill="#15201f">Doing</text>
    <text x="774" y="0" font-size="28" fill="#5a6463" text-anchor="end">1</text>
    <g transform="translate(0 32)" filter="url(#s)">
      <rect width="774" height="240" rx="30" fill="#ffffff"/>
      <text x="40" y="66" font-size="36" font-weight="600" fill="#15201f">Set up watering</text>
      <g transform="translate(40 104)" font-size="28" fill="#15201f">
        <rect width="30" height="30" rx="9" fill="#0b5e5a"/>
        <path d="M8 15 l5 5 l10 -11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="25" fill="#5a6463" text-decoration="line-through">Buy a hose timer</text>
        <rect y="52" width="30" height="30" rx="9" fill="none" stroke="#9aa7a5" stroke-width="3"/>
        <text x="48" y="77">Lay the drip line</text>
      </g>
      <text x="734" y="66" font-size="26" font-weight="600" fill="#5a6463" text-anchor="end">1 / 2</text>
    </g>
  </g>

  <!-- Done -->
  <g transform="translate(56 1144)">
    <circle cx="10" cy="-10" r="9" fill="#0b5e5a"/>
    <text x="32" y="0" font-size="30" font-weight="700" fill="#15201f">Done</text>
    <text x="774" y="0" font-size="28" fill="#5a6463" text-anchor="end">2</text>
    <g transform="translate(0 32)" filter="url(#s)">
      <rect width="774" height="112" rx="30" fill="#ffffff"/>
      <circle cx="58" cy="56" r="20" fill="#0b5e5a"/>
      <path d="M48 56 l7 7 l13 -14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="68" font-size="34" font-weight="600" fill="#5a6463">Build raised beds</text>
    </g>
    <g transform="translate(0 168)" filter="url(#s)">
      <rect width="774" height="112" rx="30" fill="#ffffff"/>
      <circle cx="58" cy="56" r="20" fill="#0b5e5a"/>
      <path d="M48 56 l7 7 l13 -14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="68" font-size="34" font-weight="600" fill="#5a6463">Order seeds</text>
    </g>
  </g>

  <!-- add button -->
  <g transform="translate(730 1716)">
    <circle r="62" fill="#0b5e5a"/>
    <path d="M0 -24 v48 M-24 0 h48" stroke="#fafaf6" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect x="300" y="1876" width="286" height="12" rx="6" fill="#15201f" opacity=".85"/>
</svg>
